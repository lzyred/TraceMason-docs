name: Documentation / GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pin Ubuntu 24.04 until the Ubuntu 26.04 rollout is validated against this workflow.
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install docs dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - name: Smoke-test interactive demo
        run: node tests/demo-smoke.cjs
      - name: Check links and build site
        run: mkdocs build --strict
      - name: Upload build output
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tracemason-site
          path: site/
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: tracemason-site
          path: site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
