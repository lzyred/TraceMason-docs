<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户端授权 · 交互评审</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#172b3a;font:15px/1.55 system-ui,sans-serif}main,header{max-width:960px;margin:auto;padding:20px}header{display:flex;align-items:center;border-bottom:1px solid #d8dee3;gap:14px}header strong{margin-right:auto}a{color:#16697a}section{background:white;padding:24px;border:1px solid #dbe2e8;border-radius:12px;margin-bottom:16px}h1{font-size:26px}h2{font-size:18px;margin-top:0}label,output{display:block;margin:10px 0}button,input{font:inherit}button{padding:6px 13px;border:1px solid #becbd2;border-radius:7px;background:white;cursor:pointer}button:disabled{opacity:.47;cursor:default}.primary,[aria-pressed=true]{background:#185e68;color:white}input:not([type=checkbox]){width:min(100%,360px);padding:7px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.muted{color:#586b77}.tag{border-radius:20px;padding:2px 10px;background:#e0f0e9}code{font-size:13px}dialog{max-width:440px;border:1px solid #bbb;border-radius:10px}button:focus-visible{outline:3px solid #56a5b7}
</style><header><strong>TraceMason · 身份授权评审</strong><button id="serverTab" aria-pressed="true">Server</button><button id="miniTab" aria-pressed="false">Mini</button><a href="index.html">架构图</a></header><main>
<div id="server"><h1>客户端管理</h1><section><h2>专属客户端</h2><label>名称 <input id="name" placeholder="例如：开发工作站" maxlength="64"></label><fieldset><legend>授权线路</legend><label><input type="checkbox" name="route" value="Codex"> Codex</label><label><input type="checkbox" name="route" value="Claude"> Claude Code</label><label><input type="checkbox" name="route" value="Gemini"> Gemini CLI</label></fieldset><p class="row"><button id="save" class="primary">创建客户端</button><button id="revoke" disabled>撤销身份</button></p><output id="serverState">尚未创建</output><output id="activation"></output></section></div>
<div id="mini" hidden><h1>设备与服务器</h1><section><h2>客户端登录</h2><label>一次性激活码 <input id="code" autocomplete="off"></label><button id="login" class="primary">登录并获取线路</button><output id="identity"></output></section><section><h2>CLI 网关配置</h2><output id="routes"></output><button id="apply">预览并应用</button></section><section><h2>凭据轮换</h2><output id="generation"></output><output id="activity"></output><div class="row"><button id="busy">模拟会话开始</button><button id="idle">模拟会话结束</button><button id="renew">模拟到期前续领</button><button id="expire">模拟旧 Key 到期</button></div></section></div>
<p class="muted">本地交互原型 · 仅使用演示身份和凭据</p><output id="feedback" role="status"></output></main>
<dialog id="preview"><h2>确认写入 CLI 配置</h2><p id="changes"></p><div class="row"><button id="cancel">取消</button><button id="confirm" class="primary">确认应用</button></div></dialog>
<script>
const el=id=>document.getElementById(id),checks=[...document.querySelectorAll('[name=route]')];
let client=null,grant=[],ticket='',logged=false,applied=false,active=false,pending=false,expired=false,gen=0;
function report(s){el('feedback').textContent=s}
function render(){
 el('save').textContent=client?'保存授权':'创建客户端';el('revoke').disabled=!client;
 el('serverState').textContent=client?client.name+' · '+client.id:'尚未创建';
 el('activation').textContent=ticket?'一次性激活码　'+ticket:'';
 el('identity').textContent=logged?'已登录 · '+client.name+' · '+client.id:'未登录';
 el('routes').textContent=logged?grant.join('　·　'):'等待登录';
 el('generation').textContent=logged?('第 '+gen+' 代 · '+(expired?'已过期':'有效期 7 天')+(pending?' · 下一代待应用':'')):'尚无凭据';
 el('activity').textContent=applied?(active?'有活跃会话':'相关工具均空闲'):'等待首次应用';
 el('apply').disabled=!logged||active;el('login').disabled=logged;
 for(const id of ['busy','idle','renew','expire'])el(id).disabled=!applied;
 el('idle').disabled=!active;el('busy').disabled=!applied||active||expired;el('renew').disabled=!applied||pending;
}
function tab(mini){el('server').hidden=mini;el('mini').hidden=!mini;
 el('serverTab').setAttribute('aria-pressed',String(!mini));el('miniTab').setAttribute('aria-pressed',String(mini));report('')}
el('serverTab').onclick=()=>tab(false);el('miniTab').onclick=()=>tab(true);
el('save').onclick=()=>{const routes=checks.filter(x=>x.checked).map(x=>x.value),name=el('name').value.trim();if(!name||!routes.length)return report('请填写名称并选择线路');
 if(!client){client={id:'demo-'+crypto.randomUUID().slice(0,8)};ticket='demo-'+crypto.randomUUID().slice(0,8)}
 client.name=name;grant=routes;report('已保存');render()};
el('revoke').onclick=()=>{client=null;grant=[];ticket='';logged=applied=active=pending=expired=false;gen=0;el('code').value='';report('身份已撤销，后续请求被拒绝');render()};
el('login').onclick=()=>{if(!ticket||el('code').value.trim()!==ticket)return report('激活码无效或已使用');
 ticket='';el('code').value='';logged=true;gen=1;render();report('已领取七天临时凭据')};
el('apply').onclick=()=>{el('changes').textContent=grant.join('、')+' 将使用此客户端的网关地址与临时凭据。';el('preview').showModal()};
el('cancel').onclick=()=>el('preview').close();el('confirm').onclick=()=>{el('preview').close();applied=true;report('配置已应用');render()};
function rotate(){if(!active&&pending){gen++;pending=expired=false;report('配置已切换并确认新一代生效')} render()}
el('busy').onclick=()=>{active=true;render()};el('idle').onclick=()=>{active=false;rotate()};
el('renew').onclick=()=>{pending=true;report('下一代已领取，等待空闲');rotate()};
el('expire').onclick=()=>{expired=true;report('旧凭据不能发起新请求；已受理的请求可完成');render()};render();
</script></html>
